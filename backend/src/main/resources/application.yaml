spring:
  application:
    name: backend
  profiles:
    active: dev
  config:
    import: "optional:file:.env[.properties]"
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: email, profile
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID}
            client-secret: ${FACEBOOK_CLIENT_SECRET}
            scope: email, public_profile
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080
  task:
    execution:
      pool:
        core-size: 5 # Số lượng thread tối thiểu
        max-size: 20 # Số lượng thread tối đa
        queue-capacity: 100 # Hàng đợi chờ xử lý
      thread-name-prefix: "MyAsync-Task-" # Tiền tố để dễ debug
identity:
  expire-at-minute: 30
  expire-rt-day: 7
  secret-key: ${SECRET_KEY}
  audience: my-frontend-app

# Shared file-service (upload, confirm, read) - see file-service/README.md.
# Set FILE_SERVICE_URL / FILE_SERVICE_API_KEY in backend/.env (API_KEY_BLOG of file-service).
file-service:
  base-url: ${FILE_SERVICE_URL:http://localhost:4000}
  api-key: ${FILE_SERVICE_API_KEY}

# Shared mail-service (plain-text email over REST) - see mail-service/docs/huong-dan-su-dung.md.
# Set MAIL_SERVICE_URL / MAIL_SERVICE_API_KEY in backend/.env (an API key with scope mail:send created in mail-service).
mail-service:
  base-url: ${MAIL_SERVICE_URL:http://localhost:4000/api}
  api-key: ${MAIL_SERVICE_API_KEY}
  actor: blog-backend
