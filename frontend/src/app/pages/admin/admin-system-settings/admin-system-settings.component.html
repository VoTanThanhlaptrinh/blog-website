<!-- Main Content Canvas -->
<main class="py-6 px-6 md:px-10">
    <div class="max-w-[1200px] mx-auto">
        <!-- Header Section -->
        <div class="flex flex-col md:flex-row md:items-end justify-between gap-4 mb-8">
            <div class="space-y-2">
                <h1 class="text-2xl font-bold text-text-ink mb-2">Cài Đặt Hệ Thống</h1>
                <p class="font-body-lg text-body-lg text-text-muted max-w-xl">
                    Cấu hình các thông số cơ bản cho hệ thống blog.
                </p>
            </div>
        </div>

        <!-- Error Banner -->
        <div *ngIf="error" class="mb-4 p-4 bg-red-50 border border-red-200 text-red-700 rounded-md">
            {{ error }}
        </div>

        <!-- Loading Indicator -->
        <div *ngIf="loading" class="mb-4 text-sm text-secondary flex items-center gap-2">
            <span
                class="inline-block animate-spin rounded-full h-4 w-4 border-2 border-accent-rust border-t-transparent"></span>
            Đang lưu/tải dữ liệu...
        </div>

        <!-- Settings Canvas -->
        <div class="space-y-8">
            <!-- General Section -->
            <section class="space-y-8">
                <div class="bg-pure-white p-8 rounded-lg border border-on-surface/5 editorial-shadow space-y-6">
                    <h3 class="font-headline-md text-headline-md font-bold text-text-ink">Thông Tin Chung (General)</h3>

                    <div>
                        <label class="block font-label-md text-label-md mb-2 text-text-ink font-bold">Tên Website (Site
                            Title)</label>
                        <input [(ngModel)]="settings['siteName']"
                            class="w-full bg-pure-white border border-on-surface/10 rounded-lg p-3 focus:ring-2 focus:ring-accent-rust/20 focus:border-accent-rust transition-all outline-none"
                            type="text">
                    </div>

                    <div>
                        <label class="block font-label-md text-label-md mb-2 text-text-ink font-bold">Mô tả
                            (Description)</label>
                        <textarea [(ngModel)]="settings['siteDescription']"
                            class="w-full bg-pure-white border border-on-surface/10 rounded-lg p-3 focus:ring-2 focus:ring-accent-rust/20 focus:border-accent-rust transition-all outline-none"
                            rows="3"></textarea>
                    </div>

                    <div>
                        <label class="block font-label-md text-label-md mb-2 text-text-ink font-bold">Dung lượng Upload
                            tối đa (MB)</label>
                        <input [(ngModel)]="settings['maxUploadSizeMb']"
                            class="w-full bg-pure-white border border-on-surface/10 rounded-lg p-3 focus:ring-2 focus:ring-accent-rust/20 focus:border-accent-rust transition-all outline-none"
                            type="number">
                    </div>

                    <div class="flex items-center justify-between py-4 border-t border-on-surface/5">
                        <div>
                            <span class="block font-label-md text-label-md text-text-ink font-bold">Chế độ Bảo trì
                                (Maintenance Mode)</span>
                            <span class="block font-caption text-caption text-text-muted">Tạm thời khóa quyền truy cập
                                của người dùng thường khi nâng cấp hệ thống</span>
                        </div>
                        <button (click)="toggleMaintenance()"
                            [class.bg-accent-rust]="settings['maintenanceMode'] === 'true'"
                            [class.bg-on-surface]="settings['maintenanceMode'] !== 'true'"
                            class="relative inline-flex h-6 w-11 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none">
                            <span [class.translate-x-5]="settings['maintenanceMode'] === 'true'"
                                [class.translate-x-0]="settings['maintenanceMode'] !== 'true'"
                                class="pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out"></span>
                        </button>
                    </div>
                </div>
            </section>

            <!-- Save Footer -->
            <div class="mt-8 pt-8 border-t border-on-surface/5 flex justify-end gap-4">
                <button (click)="loadSettings()"
                    class="px-8 py-3 text-text-muted font-label-md text-label-md hover:text-text-ink transition-colors">
                    Hủy thay đổi
                </button>
                <button (click)="saveSettings()"
                    class="px-8 py-3 bg-accent-rust text-pure-white font-label-md text-label-md rounded shadow-sm hover:brightness-110 active:scale-95 transition-all rounded-lg">
                    Lưu tất cả thay đổi
                </button>
            </div>
        </div>

    </div>
</main>
