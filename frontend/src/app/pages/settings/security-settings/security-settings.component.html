<div class="space-y-6">
  <div>
    <h2 class="text-xl font-bold text-stone-900">Bảo mật</h2>
    <p class="text-sm text-stone-500">Đổi mật khẩu để đảm bảo an toàn cho tài khoản cá nhân.</p>
  </div>

  <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()" class="space-y-5 max-w-lg">
    <!-- Old Password -->
    <div>
      <label class="block text-sm font-medium text-stone-700 mb-1">Mật khẩu hiện tại</label>
      <input
        type="password"
        formControlName="oldPassword"
        class="w-full rounded-lg border border-stone-300 px-3.5 py-2 text-sm focus:border-accent-rust focus:outline-hidden focus:ring-1 focus:ring-accent-rust"
      />
    </div>

    <!-- New Password -->
    <div>
      <label class="block text-sm font-medium text-stone-700 mb-1">Mật khẩu mới</label>
      <input
        type="password"
        formControlName="newPassword"
        class="w-full rounded-lg border border-stone-300 px-3.5 py-2 text-sm focus:border-accent-rust focus:outline-hidden focus:ring-1 focus:ring-accent-rust"
      />
    </div>

    <!-- Confirm New Password -->
    <div>
      <label class="block text-sm font-medium text-stone-700 mb-1">Xác nhận mật khẩu mới</label>
      <input
        type="password"
        formControlName="confirmPassword"
        class="w-full rounded-lg border border-stone-300 px-3.5 py-2 text-sm focus:border-accent-rust focus:outline-hidden focus:ring-1 focus:ring-accent-rust"
      />
    </div>

    <!-- Message feedback -->
    @if (message()) {
      <div class="p-3.5 rounded-lg text-sm font-medium" [ngClass]="isError() ? 'bg-red-50 text-red-700' : 'bg-emerald-50 text-emerald-700'">
        {{ message() }}
      </div>
    }

    <!-- Submit Button -->
    <div class="pt-4 border-t border-stone-200 flex justify-end">
      <button
        type="submit"
        [disabled]="loading() || passwordForm.invalid"
        class="rounded-lg bg-accent-rust px-6 py-2.5 text-sm font-semibold text-white shadow-xs hover:bg-accent-rust/90 disabled:opacity-50 transition-colors"
      >
        {{ loading() ? 'Đang cập nhật...' : 'Đổi mật khẩu' }}
      </button>
    </div>
  </form>
</div>
