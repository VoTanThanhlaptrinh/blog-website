<div class="space-y-6">
  <div>
    <h2 class="text-xl font-bold text-stone-900">Trang cá nhân</h2>
    <p class="text-sm text-stone-500">Cập nhật thông tin công khai và hồ sơ cá nhân của bạn.</p>
  </div>

  <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="space-y-6">
    <!-- Phone -->
    <div>
      <label class="block text-sm font-medium text-stone-700 mb-1">Số điện thoại</label>
      <input
        type="text"
        formControlName="phone"
        placeholder="0912345678"
        class="w-full rounded-lg border border-stone-300 px-3.5 py-2 text-sm focus:border-accent-rust focus:outline-hidden focus:ring-1 focus:ring-accent-rust"
      />
    </div>

    <!-- Bio -->
    <div>
      <label class="block text-sm font-medium text-stone-700 mb-1">Giới thiệu (Bio)</label>
      <textarea
        formControlName="bio"
        rows="4"
        placeholder="Viết một vài dòng giới thiệu về bản thân bạn..."
        class="w-full rounded-lg border border-stone-300 px-3.5 py-2 text-sm focus:border-accent-rust focus:outline-hidden focus:ring-1 focus:ring-accent-rust"
      ></textarea>
    </div>

    <!-- Birth Date -->
    <div>
      <label class="block text-sm font-medium text-stone-700 mb-1">Ngày sinh</label>
      <input
        type="date"
        formControlName="birthDate"
        class="w-full sm:w-64 rounded-lg border border-stone-300 px-3.5 py-2 text-sm focus:border-accent-rust focus:outline-hidden focus:ring-1 focus:ring-accent-rust"
      />
    </div>

    <!-- Message feedback -->
    @if (message()) {
      <div class="p-3.5 rounded-lg text-sm font-medium" [ngClass]="isError() ? 'bg-red-50 text-red-700' : 'bg-emerald-50 text-emerald-700'">
        {{ message() }}
      </div>
    }

    <!-- Submit Button -->
    <div class="pt-4 border-t border-stone-200 flex justify-end">
      <button
        type="submit"
        [disabled]="loading() || profileForm.invalid"
        class="rounded-lg bg-accent-rust px-6 py-2.5 text-sm font-semibold text-white shadow-xs hover:bg-accent-rust/90 disabled:opacity-50 transition-colors"
      >
        {{ loading() ? 'Đang lưu...' : 'Lưu thay đổi' }}
      </button>
    </div>
  </form>
</div>
