<header class="sticky top-0 z-50 w-full border-b border-stone-200 bg-white/90 backdrop-blur-md">
  <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">
    <!-- Logo -->
    <a routerLink="/" class="flex items-center gap-2" (click)="closeMobileMenu()">
      <span class="flex h-9 w-9 items-center justify-center rounded-lg bg-clay-600 text-lg font-bold text-white">B</span>
      <span class="text-xl font-bold tracking-tight text-stone-900">BlogHub</span>
    </a>

    <!-- Desktop nav -->
    <nav class="hidden items-center gap-1 md:flex">
      @for (link of navLinks; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="text-clay-600 bg-clay-50"
          [routerLinkActiveOptions]="{ exact: link.path === '/' }"
          class="rounded-md px-3 py-2 text-sm font-medium text-stone-600 transition-colors hover:bg-stone-100 hover:text-stone-900"
        >
          {{ link.label }}
        </a>
      }
    </nav>

    <!-- Desktop auth buttons -->
    <div class="hidden items-center gap-3 md:flex">
      <a routerLink="/login" class="text-sm font-medium text-stone-600 transition-colors hover:text-stone-900">
        Đăng nhập
      </a>
      <a
        routerLink="/register"
        class="rounded-md bg-clay-600 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-clay-700"
      >
        Đăng ký
      </a>
    </div>

    <!-- Mobile menu toggle -->
    <button
      type="button"
      class="inline-flex items-center justify-center rounded-md p-2 text-stone-600 hover:bg-stone-100 md:hidden"
      (click)="toggleMobileMenu()"
      [attr.aria-expanded]="mobileMenuOpen()"
      aria-label="Mở menu"
    >
      @if (mobileMenuOpen()) {
        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      } @else {
        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5M3.75 17.25h16.5" />
        </svg>
      }
    </button>
  </div>

  <!-- Mobile menu -->
  @if (mobileMenuOpen()) {
    <div class="border-t border-stone-200 bg-white md:hidden">
      <nav class="space-y-1 px-4 py-3">
        @for (link of navLinks; track link.path) {
          <a
            [routerLink]="link.path"
            routerLinkActive="text-clay-600 bg-clay-50"
            [routerLinkActiveOptions]="{ exact: link.path === '/' }"
            (click)="closeMobileMenu()"
            class="block rounded-md px-3 py-2 text-base font-medium text-stone-600 hover:bg-stone-100 hover:text-stone-900"
          >
            {{ link.label }}
          </a>
        }
      </nav>
      <div class="flex flex-col gap-2 border-t border-stone-200 px-4 py-3">
        <a
          routerLink="/login"
          (click)="closeMobileMenu()"
          class="rounded-md px-3 py-2 text-center text-sm font-medium text-stone-600 hover:bg-stone-100"
        >
          Đăng nhập
        </a>
        <a
          routerLink="/register"
          (click)="closeMobileMenu()"
          class="rounded-md bg-clay-600 px-4 py-2 text-center text-sm font-medium text-white hover:bg-clay-700"
        >
          Đăng ký
        </a>
      </div>
    </div>
  }
</header>
