<footer class="border-t border-stone-200 bg-white">
  <div class="mx-auto max-w-6xl px-4 py-12">
    <div class="grid grid-cols-2 gap-8 md:grid-cols-4">
      <div class="col-span-2 md:col-span-1">
        <a routerLink="/" class="flex items-center gap-2">
          <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-clay-600 text-sm font-bold text-white">B</span>
          <span class="text-lg font-bold text-stone-900">BlogHub</span>
        </a>
        <p class="mt-4 text-sm text-stone-500">
          Nơi chia sẻ kiến thức, câu chuyện và ý tưởng của cộng đồng.
        </p>
      </div>

      @for (col of columns; track col.title) {
        <div>
          <h3 class="text-sm font-semibold text-stone-900">{{ col.title }}</h3>
          <ul class="mt-4 space-y-2">
            @for (link of col.links; track link.path) {
              <li>
                <a
                  [routerLink]="link.path"
                  class="text-sm text-stone-500 transition hover:text-clay-600"
                >{{ link.label }}</a>
              </li>
            }
          </ul>
        </div>
      }
    </div>

    <div class="mt-10 border-t border-stone-100 pt-6 text-center text-sm text-stone-400">
      © {{ year }} BlogHub. Bảo lưu mọi quyền.
    </div>
  </div>
</footer>
